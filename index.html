<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Long Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #fafafa;
            line-height: 1.6;
        }

        .block {
            width: 100%;
            height: 1200px; /* huge block to simulate long scroll */
            background: linear-gradient(to bottom, #ededed, #ffffff);
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #555;
        }

        .yellow-button {
            width: 80%;
            max-width: 400px;
            padding: 24px;
            background: rgb(240, 191, 76); /* your yellow color */
            color: #000;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            border-radius: 12px;
            margin: 80px auto;
            cursor: pointer;
        }

        .container {
            text-align: center;
            padding-bottom: 300px;
        }
    </style>
</head>

<body>

    <!-- Massive filler blocks -->
    <div class="block">Scroll…</div>
    <div class="block">Keep scrolling…</div>
    <div class="block">Still going…</div>
    <div class="block">Almost half way…</div>
    <div class="block">More content…</div>
    <div class="block">Scrolling…</div>
    <div class="block">Deep scroll test…</div>
    <div class="block">Almost there…</div>
    <div class="block">Final stretch…</div>

    <div class="container">
        <div class="yellow-button">CLICK ME</div>
    </div>

</body>
</html>
